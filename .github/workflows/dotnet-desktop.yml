name: .NET Desktop

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: >
          dotnet restore DataFlushWinUI.csproj
          -r win-${{ matrix.platform }}
          -p:PublishReadyToRun=false

      - name: Build
        run: >
          dotnet build DataFlushWinUI.csproj
          -c ${{ matrix.configuration }}
          -r win-${{ matrix.platform }}
          --no-restore
          -p:PublishReadyToRun=false

      - name: Publish self-contained
        run: >
          dotnet publish DataFlushWinUI.csproj
          -c ${{ matrix.configuration }}
          -r win-${{ matrix.platform }}
          --self-contained true
          --no-build
          -p:WindowsAppSDKSelfContained=true
          -p:PublishReadyToRun=false
          -o publish/DataFlushWinUI-win-${{ matrix.platform }}

      - name: Create zip package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive `
            -Path "publish/DataFlushWinUI-win-${{ matrix.platform }}/*" `
            -DestinationPath "artifacts/DataFlushWinUI-win-${{ matrix.platform }}.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataFlushWinUI-win-${{ matrix.platform }}
          path: artifacts/DataFlushWinUI-win-${{ matrix.platform }}.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/DataFlushWinUI-win-${{ matrix.platform }}.zip
          generate_release_notes: true
